# XcodeGen project spec. `xcodegen generate` in this directory produces Quire.xcodeproj
# (gitignored). ./run-ios.sh does both and runs the app; `harbor run ios` calls it.
#
# The bundled web half (runtime/, host.js, Seed/) lives in ios/Generated/, built by
# scripts/build-mobile-host.mjs: run-ios.sh runs it before generating (so the folder exists
# for the references below) and the "Build mobile host" phase runs it on every build (so an
# Xcode.app build picks up runtime.js edits). It needs node, not the network.
name: Quire
options:
  bundleIdPrefix: org.harborapps.quire
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
targets:
  Quire:
    type: application
    platform: iOS
    sources:
      - path: Quire
        excludes:
          - "**/*.md"
      - path: Generated/runtime
        type: folder
        buildPhase: resources
      - path: Generated/Seed
        type: folder
        buildPhase: resources
      - path: Generated/host.js
        buildPhase: resources
    preBuildScripts:
      - name: Build mobile host
        basedOnDependencyAnalysis: false
        script: |
          exec "$SRCROOT/scripts/build-mobile-host.sh"
    settings:
      base:
        PRODUCT_NAME: Quire
        PRODUCT_BUNDLE_IDENTIFIER: org.harborapps.quire.mobile
        # The name on the Home Screen. Must equal BRAND.name in core/brand.mjs
        # (scripts/build-mobile-host.mjs fails the build when it doesn't). Swift reads it as Brand.name.
        INFOPLIST_KEY_CFBundleDisplayName: Noteblock
        SWIFT_VERSION: "5.9"
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "0.1"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # The pre-build phase reads ../scripts and ../app/runtime and writes ios/Generated.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    info:
      path: Quire/Info.plist
      properties:
        CFBundleDisplayName: Noteblock
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # The vault folder in Documents shows up in the Files app (On My iPhone > Noteblock).
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        ITSAppUsesNonExemptEncryption: false
