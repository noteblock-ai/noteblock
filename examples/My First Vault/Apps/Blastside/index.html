  .note { margin: 0; padding: 14px 20px; font: var(--q-text-size, 16px)/1.55 var(--q-page-font, system-ui, -apple-system, sans-serif); color: var(--q-ink, #1d1d1f); background: var(--q-ground, #fff); flex: none; }
</style>
</head>
<body data-q-theme="none">
