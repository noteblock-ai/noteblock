<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Guestbook</title>
<style>
  body { max-width: 560px; margin: 48px auto; padding: 0 24px; }
  form { display: flex; flex-direction: column; gap: 8px; margin: 16px 0 28px; }
  input, textarea { font: inherit; padding: 8px 10px; border: 1px solid #e4e6ea; border-radius: 8px; }
  button { align-self: flex-start; font: inherit; padding: 6px 14px; border-radius: 8px; border: 0; background: #15171c; color: #fff; }
  ul { list-style: none; padding: 0; display: flex; flex-direction: column; gap: 14px; }
  li small { color: #8a909c; }
</style>
</head>
<body>
<h1 id="greeting">Guestbook</h1>
<p>This page has a backend: <code>backend/server.js</code>, run by Noteblock with Node. The page talks to it at <code>api/entries</code>.</p>
<form id="form">
  <input id="name" placeholder="Your name" required>
  <textarea id="note" rows="2" placeholder="Say something" required></textarea>
  <button>Sign</button>
</form>
<ul id="list"></ul>
<script>
  const list = document.getElementById("list");
  async function load() {
    const { greeting, entries } = await fetch("api/entries").then((r) => r.json());
    document.getElementById("greeting").textContent = greeting;
    list.replaceChildren(...entries.map((e) => {
      const li = document.createElement("li");
      li.innerHTML = "<b></b> <small></small><div></div>";
      li.querySelector("b").textContent = e.name;
      li.querySelector("small").textContent = new Date(e.at).toLocaleString();
      li.querySelector("div").textContent = e.note;
      return li;
    }));
  }
  document.getElementById("form").addEventListener("submit", async (ev) => {
    ev.preventDefault();
    const name = document.getElementById("name"), note = document.getElementById("note");
    await fetch("api/entries", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ name: name.value, note: note.value }) });
    note.value = "";
    load();
  });
  load().catch((err) => { list.textContent = "The backend isn't running: " + err.message; });
</script>
</body>
</html>
